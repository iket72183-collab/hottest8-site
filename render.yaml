# Review-only reference for existing service srv-dbc31ujrjlhs73al9icg.
# Applying this requires Isaac's deployment approval. Dashboard settings may differ.
services:
  - type: web
    runtime: static
    name: hottest8
    buildCommand: python3 tools/build_site.py
    staticPublishPath: dist
    # PR previews are intentionally not enabled by this reference config.
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    routes:
      - type: rewrite
        source: /*
        destination: /404.html
# Reference only: mirror these settings in the dashboard; not Blueprint-synced.
# Retains main's existing catch-all route. Confirm missing-path HTTP semantics on release.
# A CSP must be staged against the provider form/reCAPTCHA before enforcement.
