# Review-only reference for existing service srv-dbc31ujrjlhs73al9icg.
# Applying this requires Isaac's deployment approval. Dashboard settings may differ.
services:
  - type: web
    runtime: static
    name: hottest8
    buildCommand: python3 tools/build_site.py
    staticPublishPath: dist
    # PR previews are intentionally not enabled by this reference config.
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
# Render uses the root 404.html automatically for missing static paths.
# No wildcard rewrite: unknown addresses must return a real 404.
# A CSP must be staged against the provider form/reCAPTCHA before enforcement.
